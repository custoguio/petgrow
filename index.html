<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetGrow</title>

<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

<style>
:root{--orange:#FC6621;--green:#2ecc71;--red:#ff5252;--blue:#3498db;--purple:#9b59b6;--bg:#f6f7fb;--beige:#EBD1C2}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
body{margin:0;background:var(--bg)}
.topbar{background:#FC6621;color:#fff;padding:18px;display:flex;align-items:center;gap:14px}.logo{width:42px;height:42px;object-fit:contain}.topbar h2{margin:0;font-size:2rem}
.container{padding:14px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}
button{border:none;border-radius:16px;padding:14px 18px;font-weight:700;color:#fff;cursor:pointer;transition:.2s}
.btn-open{background:var(--orange)}
.btn-hist{background:var(--blue)}
.btn-close{background:var(--red)}
.btn-add{position:fixed;bottom:18px;right:18px;background:var(--green);width:64px;height:64px;border-radius:50%;font-size:34px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.actions{display:flex;gap:12px;margin-top:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:10px}
.modal .box{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:16px;max-height:90vh;overflow:auto}
input,select,textarea{width:100%;padding:8px;margin-top:5px;border:2px solid #FF661A;border-radius:10px}
.metric{margin:10px 0}
.metric-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:16px;color:#222}
.metric-head .percent{font-weight:800}
.store-card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.store-title{font-size:22px;font-weight:800;color:#FC6621;margin-bottom:16px}
.bar{height:22px;background:var(--beige);border-radius:12px;overflow:hidden}
.fill{height:100%;border-radius:12px}
.m1{background:#FF661A}.m2{background:#2ecc71}.m3{background:#3498db}.m4{background:#9b59b6}
@media(max-width:600px){.actions{flex-direction:column}.actions button{width:100%}}
.hist-card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;border-left:5px solid #2ecc71}.tag{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}.positivo{background:#DDF7E7;color:#2ecc71}.negativo{background:#FFE2E2;color:#ff5252}
</style>
</head>
<body>

<header class="topbar">
<img class="logo" src="https://play-lh.googleusercontent.com/R2qRv_VzzwD2k_3r9TMpZEa0N15JypDd7wjzsy4Mu5jmerILQxGqwM_ifwobN6VtBY0" alt="PetCamp">
<div><h2>PetGrow</h2></div>
</header>

<div id="storeSelector" class="container">
<div class="card">
<h3>Selecione sua loja</h3>
<select id="lojaSelect"></select>
<div class="actions">
<button class="btn-open" onclick="entrarLoja()">Entrar</button>
</div>
</div>
</div>

<div id="appArea" style="display:none">
<div class="container">
<h3 id="nomeLoja"></h3>
<div id="cards" class="grid"></div>
</div>
<button class="btn-add" onclick="openAdd()">+</button>
</div>

<div id="addModal" class="modal"><div class="box">
<h3>Novo colaborador</h3>
<input id="c_nome" placeholder="Nome">
<div class="actions">
<button class="btn-open" onclick="saveColab()">Salvar</button>
<button class="btn-close" onclick="closeAdd()">Cancelar</button>
</div>
</div></div>

<div id="profileModal" class="modal"><div class="box">
<h3 id="p_nome"></h3>
<div id="metrics"></div>
<div class="actions">
<button class="btn-hist" onclick="openHistory()">Histórico</button>
<button class="btn-close" onclick="closeProfile()">Fechar</button>
</div>
<button class="btn-close" onclick="inativarColaborador()">Inativar colaborador</button>
</div></div>

<div id="histModal" class="modal"><div class="box">
<h3>Registrar ocorrência</h3>
<select id="histArea">
<option value="m1">Atendimento</option>
<option value="m2">Colaboração</option>
<option value="m3">Responsabilidade</option>
<option value="m4">Conhecimento</option>
</select>
<select id="histType">
<option value="pos">Positivo</option>
<option value="neg">Negativo</option>
<option value="carta">Carta</option>
<option value="advert">Advertência</option>
<option value="susp">Suspensão</option>
<option value="falta">Falta</option>
</select>
<textarea id="histText"></textarea>
<div class="actions">
<button class="btn-open" onclick="addHistory()">Salvar</button>
<button class="btn-close" onclick="closeHistory()">Fechar</button>
</div>
<div id="histList"></div>
</div></div>

<script>
Parse.initialize(
"ZSd4EGTS16Zt4s1mLq4aE3SwPxtP8ts3F6U3LfhN",
"dZ5p1OD3slefHO7fXbrepsh80LMPDVvo14DFUPhP"
);
Parse.serverURL="https://parseapi.back4app.com/";

let lojaAtual=null;
let colaboradores=[];
let current=null;

function impactValue(type){
return {pos:2,neg:-2,carta:-4,advert:-6,susp:-8,falta:-8}[type]||0;
}

function clamp(v){return Math.max(0,Math.min(100,v));}

window.onload=carregarLojas;

async function carregarLojas(){
const Loja=Parse.Object.extend("Loja");
const q=new Parse.Query(Loja);
q.equalTo("ativo",true);
const lojas=await q.find();

const s=document.getElementById("lojaSelect");
s.innerHTML=lojas.map(l=>`<option value="${l.id}">${l.get("nome")}</option>`).join("");
}

async function entrarLoja(){
lojaAtual=document.getElementById("lojaSelect").value;
document.getElementById("storeSelector").style.display="none";
document.getElementById("appArea").style.display="block";

const Loja=Parse.Object.extend("Loja");
const q=new Parse.Query(Loja);
const loja=await q.get(lojaAtual);
document.getElementById("nomeLoja").textContent=loja.get("nome");

await carregarColaboradores();
}

async function carregarColaboradores(){
const Loja=Parse.Object.extend("Loja");
const Colaborador=Parse.Object.extend("Colaborador");

const lojaPointer=new Loja();
lojaPointer.id=lojaAtual;

const q=new Parse.Query(Colaborador);
q.equalTo("loja",lojaPointer);
q.equalTo("ativo",true);

const dados=await q.find();

colaboradores=dados.map(x=>({
id:x.id,
nome:x.get("nome")
}));

render();
}

async function calcularMetricasLoja(){
if(colaboradores.length===0) return {m1:50,m2:50,m3:50,m4:50};

let total={m1:0,m2:0,m3:0,m4:0};

for(const colab of colaboradores){
 const m=await calcularMetricas(colab.id);
 total.m1+=m.m1;
 total.m2+=m.m2;
 total.m3+=m.m3;
 total.m4+=m.m4;
}

return {
 m1:Math.round(total.m1/colaboradores.length),
 m2:Math.round(total.m2/colaboradores.length),
 m3:Math.round(total.m3/colaboradores.length),
 m4:Math.round(total.m4/colaboradores.length)
};
}

async function render(){
const box=document.getElementById("cards");
box.innerHTML="";

const lojaMetrics=await calcularMetricasLoja();

const lojaCard=document.createElement("div");
lojaCard.className="store-card";

lojaCard.innerHTML=`
<div class="store-title">${document.getElementById("nomeLoja").textContent}</div>
${Object.entries(lojaMetrics).map(([k,v],i)=>`
<div class="metric">
<div class="metric-head">
<span>${["Atendimento","Colaboração","Responsabilidade","Conhecimento"][i]}</span>
<span class="percent">${v}%</span>
</div>
<div class="bar"><div class="fill m${i+1}" style="width:${v}%"></div></div>
</div>`).join("")}`;

box.appendChild(lojaCard);

colaboradores.forEach(c=>{
const div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${c.nome}</h3>
<div class="actions">
<button class="btn-open">Perfil</button>
<button class="btn-hist">Histórico</button>
</div>`;

const [b1,b2]=div.querySelectorAll("button");
b1.onclick=()=>openProfile(c.id);
b2.onclick=()=>{current=c.id;openHistory();};
box.appendChild(div);
});
}

function openAdd(){addModal.style.display="flex";}
function closeAdd(){addModal.style.display="none";}

async function saveColab(){
const nome=c_nome.value.trim();
if(!nome) return;

const Loja=Parse.Object.extend("Loja");
const Colaborador=Parse.Object.extend("Colaborador");

const loja=new Loja();
loja.id=lojaAtual;

const c=new Colaborador();
c.set("nome",nome);
c.set("ativo",true);
c.set("loja",loja);

await c.save();

c_nome.value="";
closeAdd();
await carregarColaboradores();
}

async function openProfile(id){
current=id;
profileModal.style.display="flex";

const colab=colaboradores.find(x=>x.id===id);
p_nome.textContent=colab.nome;

const metrics=await calcularMetricas(id);

document.getElementById("metrics").innerHTML=Object.entries(metrics).map(([k,v],i)=>`
<div class="metric">
<div class="metric-head">
<span>${["Atendimento","Colaboração","Responsabilidade","Conhecimento"][i]}</span>
<span class="percent">${v}%</span>
</div>
<div class="bar"><div class="fill m${i+1}" style="width:${v}%"></div></div>
</div>`).join("");
}

function closeProfile(){profileModal.style.display="none";}

async function calcularMetricas(colabId){
const hist=await carregarHistorico(colabId);
let base={m1:50,m2:50,m3:50,m4:50};

hist.forEach(h=>{
base[h.area]=clamp(base[h.area]+impactValue(h.tipo));
});

return base;
}

async function carregarHistorico(colabId){
const Colaborador=Parse.Object.extend("Colaborador");
const Ocorrencia=Parse.Object.extend("Ocorrencia");

const colab=new Colaborador();
colab.id=colabId;

const q=new Parse.Query(Ocorrencia);
q.equalTo("colaborador",colab);
q.descending("createdAt");

const dados=await q.find();

return dados.map(x=>({
id:x.id,
area:x.get("area"),
tipo:x.get("tipo"),
descricao:x.get("descricao"),
data:x.createdAt.toLocaleString()
}));
}

async function openHistory(){
histModal.style.display="flex";
renderHist();
}

function closeHistory(){histModal.style.display="none";}

async function addHistory(){
const Colaborador=Parse.Object.extend("Colaborador");
const Ocorrencia=Parse.Object.extend("Ocorrencia");

const colab=new Colaborador();
colab.id=current;

const o=new Ocorrencia();
o.set("colaborador",colab);
o.set("area",histArea.value);
o.set("tipo",histType.value);
o.set("descricao",histText.value);
o.set("dataOcorrencia",new Date());

await o.save();

histText.value="";
renderHist();
}

async function renderHist(){
const h=await carregarHistorico(current);
const areaLabel={m1:'Atendimento',m2:'Colaboração',m3:'Responsabilidade',m4:'Conhecimento'};
const tipoLabel={pos:'Ocorrência positiva',neg:'Ocorrência negativa',carta:'Carta de orientação',advert:'Advertência',susp:'Suspensão',falta:'Falta'};
histList.innerHTML=h.map(x=>{
const cls=x.tipo==='pos'?'positivo':'negativo';
return `<div class="hist-card">
<div><span class="tag ${cls}">${tipoLabel[x.tipo]||x.tipo}</span></div>
<h4>${areaLabel[x.area]||x.area}</h4>
<div>${x.descricao||''}</div>
<small>${x.data}</small>
</div>`;
}).join('');
}

async function inativarColaborador(){
if(!confirm("Inativar colaborador?")) return;

const Colaborador=Parse.Object.extend("Colaborador");
const q=new Parse.Query(Colaborador);
const c=await q.get(current);

c.set("ativo",false);
await c.save();

closeProfile();
await carregarColaboradores();
}
</script>

</body>
</html>
