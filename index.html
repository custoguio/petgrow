<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>petgrow</title>
<style>
:root{--orange:#FF661A;--green:#2ecc71;--red:#ff5252;--blue:#3498db;--purple:#9b59b6;--bg:#f6f7fb}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
body{margin:0;background:var(--bg)}
header{background:var(--orange);color:#fff;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header img{height:36px}
.container{padding:14px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.10)}
.card h3{margin:0 0 4px}
.small{font-size:13px;opacity:.7}
.actions{display:flex;gap:8px;margin-top:10px}
button{border:none;border-radius:12px;padding:10px;font-weight:700;color:#fff}
.btn-add{position:fixed;bottom:18px;right:18px;background:var(--green);width:58px;height:58px;border-radius:50%;font-size:28px}
.btn-open{background:var(--orange);flex:1}
.btn-hist{background:var(--blue);flex:1}
.btn-close{background:var(--red)}
.btn-delete{background:var(--red);width:100%;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:10px}
.modal .box{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:16px}
label{font-weight:700;margin-top:8px;display:block}
input,textarea,select{width:100%;padding:8px;border-radius:10px;border:2px solid #FF661A;margin-top:4px}
.metric{margin:12px 0}
.bar{height:16px;border-radius:10px;background:#FF661A33;overflow:hidden}
.fill{height:100%;width:0}
.m1{background:#FF661A}.m2{background:#2ecc71}.m3{background:#3498db}.m4{background:#9b59b6}
.metric-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.metric-actions{display:flex;gap:8px;margin-top:6px}
.metric-actions button{flex:1;height:36px;font-size:13px;font-weight:700;border-radius:10px;display:flex;align-items:center;justify-content:center}
.btn-plus{background:var(--green)}
.btn-minus{background:var(--red)}
.history-item{border-bottom:1px solid #FF661A;padding:8px 0}
.badge{display:inline-block;padding:2px 6px;border-radius:6px;font-size:11px;margin-left:6px;color:#fff}
.pos{background:#2ecc71}.neg{background:#ff5252}
</style>
</head>
<body>
<header>
<img src="https://play-lh.googleusercontent.com/R2qRv_VzzwD2k_3r9TMpZEa0N15JypDd7wjzsy4Mu5jmerILQxGqwM_ifwobN6VtBY0" />
<h2>petgrow</h2>
</header>
<div class="container">
<div id="cards" class="grid"></div>
</div>
<button class="btn-add" onclick="openAdd()">+</button>

<!-- ADD COLLABORATOR -->
<div id="addModal" class="modal"><div class="box">
<h3>Novo colaborador</h3>
<label>Nome</label><input id="c_nome">
<label>Cargo</label><input id="c_cargo">
<label>Lotação</label><input id="c_lotacao">
<label>Data admissão</label><input type="date" id="c_data">
<div class="actions">
<button class="btn-open" onclick="saveColab()">Salvar</button>
<button class="btn-close" onclick="closeAdd()">Cancelar</button>
</div>
</div></div>

<!-- PROFILE -->
<div id="profileModal" class="modal"><div class="box">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3 id="p_nome"></h3>
<button class="btn-close" onclick="closeProfile()">Fechar</button>
</div>
<div id="metrics"></div>
<div class="actions">
<button class="btn-hist" onclick="openHistory()">Histórico</button>
<button class="btn-open" onclick="openExtra()">Informações adicionais</button>
</div>
<button class="btn-delete" onclick="deleteColab()">Excluir colaborador</button>
</div></div>

<!-- HISTORY -->
<div id="histModal" class="modal"><div class="box">
<h3>Registrar ocorrência</h3>
<label>Área</label>
<select id="histArea">
<option value="m1">Atendimento</option>
<option value="m2">Colaboração</option>
<option value="m3">Responsabilidade</option>
<option value="m4">Conhecimento</option>
</select>
<label>Tipo</label>
<select id="histType">
<option value="pos">Positivo</option>
<option value="neg">Negativo</option>
</select>
<label>Descrição</label>
<textarea id="histText"></textarea>
<div class="actions">
<button class="btn-open" onclick="addHistory()">Salvar</button>
<button class="btn-close" onclick="closeHistory()">Fechar</button>
</div>
<h3 style="margin-top:14px">Registros</h3>
<div id="histList"></div>
</div></div>

<!-- EXTRA -->
<div id="extraModal" class="modal"><div class="box">
<h3>Informações adicionais</h3>
<label>Formação</label><textarea id="ex1"></textarea>
<label>Soft skills</label><textarea id="ex2"></textarea>
<label>Hard skills</label><textarea id="ex3"></textarea>
<label>Meta</label><input id="ex4">
<div class="actions">
<button class="btn-open" onclick="saveExtra()">Salvar</button>
<button class="btn-close" onclick="closeExtra()">Fechar</button>
</div>
</div></div>

<script>
let colaboradores=JSON.parse(localStorage.getItem('pg_colabs')||'[]');
let current=null;

function persist(){localStorage.setItem('pg_colabs',JSON.stringify(colaboradores));}

function render(){
const box=document.getElementById('cards');
box.innerHTML='';
colaboradores.forEach(c=>{
const div=document.createElement('div');
div.className='card';
div.innerHTML=`<h3>${c.nome}</h3>
<div class='small'>${c.cargo||''} • ${c.lotacao||''}</div>
<div class='actions'>
<button class='btn-open'>Perfil</button>
<button class='btn-hist'>Histórico</button>
</div>`;
const [b1,b2]=div.querySelectorAll('button');
b1.onclick=()=>openProfile(c.id);
b2.onclick=()=>{current=c.id;openHistory();};
box.appendChild(div);
});}

function openAdd(){addModal.style.display='flex';}
function closeAdd(){addModal.style.display='none';}

function saveColab(){
if(!c_nome.value.trim()) return alert('Informe o nome');
const c={id:Date.now().toString(),nome:c_nome.value,cargo:c_cargo.value,lotacao:c_lotacao.value,data:c_data.value,metrics:{m1:50,m2:50,m3:50,m4:50}};
colaboradores.push(c);persist();closeAdd();render();}

function openProfile(id){current=id;profileModal.style.display='flex';const c=colaboradores.find(x=>x.id===id);p_nome.textContent=c.nome;drawMetrics(c);} 
function closeProfile(){profileModal.style.display='none';}

function drawMetrics(c){
metrics.innerHTML='';
const titles=['Atendimento','Colaboração','Responsabilidade','Conhecimento'];
['m1','m2','m3','m4'].forEach((key,i)=>{
const v=c.metrics[key];
const m=document.createElement('div');
m.className='metric';
m.innerHTML=`<div class='metric-head'><span>${titles[i]}</span><span>${v}%</span></div>
<div class='bar'><div class='fill m${i+1}' style='width:${v}%'></div></div>
<div class='metric-actions'>
<button class='btn-plus'>+2</button>
<button class='btn-minus'>-2</button></div>`;
const [plus,minus]=m.querySelectorAll('button');
plus.onclick=()=>adj(key,2);
minus.onclick=()=>adj(key,-2);
metrics.appendChild(m);
});}

function adj(k,val){const c=colaboradores.find(x=>x.id===current);c.metrics[k]=Math.max(0,Math.min(100,c.metrics[k]+val));persist();drawMetrics(c);} 

// HISTORY
function openHistory(){histModal.style.display='flex';renderHist();}
function closeHistory(){histModal.style.display='none';}
function getHist(){return JSON.parse(localStorage.getItem('pg_hist_'+current)||'[]');}
function setHist(v){localStorage.setItem('pg_hist_'+current,JSON.stringify(v));}
function addHistory(){
const t=histText.value.trim(); if(!t) return alert('Descreva o ocorrido');
const area=histArea.value; const type=histType.value;
const h=getHist(); h.unshift({t,d:new Date().toLocaleString(),area,type}); setHist(h);
// impacta automaticamente a barra
const impact= type==='pos'?2:-2; adj(area,impact);
histText.value=''; renderHist();
}
function renderHist(){
const h=getHist();
histList.innerHTML=h.map((x,i)=>`<div class='history-item'><b>${x.d}</b> <span class='badge ${x.type==='pos'?'pos':'neg'}'>${x.type==='pos'?'Positivo':'Negativo'}</span><br><i>${areaName(x.area)}</i><br>${x.t}<div class='actions'><button class='btn-close' onclick='delHist(${i})'>Excluir</button></div></div>`).join('');}
function delHist(i){const h=getHist();h.splice(i,1);setHist(h);renderHist();}
function areaName(a){return {m1:'Atendimento',m2:'Colaboração',m3:'Responsabilidade',m4:'Conhecimento'}[a];}

// EXTRA
function openExtra(){extraModal.style.display='flex';const d=JSON.parse(localStorage.getItem('pg_extra_'+current)||'{}');ex1.value=d.f||'';ex2.value=d.s||'';ex3.value=d.h||'';ex4.value=d.m||'';}
function closeExtra(){extraModal.style.display='none';}
function saveExtra(){localStorage.setItem('pg_extra_'+current,JSON.stringify({f:ex1.value,s:ex2.value,h:ex3.value,m:ex4.value}));closeExtra();}

// DELETE
function deleteColab(){if(!confirm('Deseja realmente excluir este colaborador?')) return; colaboradores=colaboradores.filter(c=>c.id!==current); persist(); closeProfile(); render();}

render();
</script>
</body>
</html>
